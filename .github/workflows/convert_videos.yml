name: Convert Images to Videos

on:
  schedule:
    # Run at 12:00 AM UTC every day
    - cron: '0 0 * * *'
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  convert:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install FFmpeg
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install Pillow  # For image resolution checking
    
    - name: Run conversion script
      run: python convert_images_to_video.py
    
    - name: Commit and push changes (if any)
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add VIDEO/
        git add IMAGE/
        git diff --staged --quiet || git commit -m "Auto-convert images to videos [skip ci]"
        git push
