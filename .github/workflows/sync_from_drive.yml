name: Sync from Google Drive

on:
  schedule:
    # Run at 10:00 PM UTC every day
    - cron: '0 22 * * *'
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client
    
    - name: Decode Google Drive credentials
      env:
        GOOGLE_DRIVE_CREDENTIALS_BASE64: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS_BASE64 }}
      run: |
        if [ -n "$GOOGLE_DRIVE_CREDENTIALS_BASE64" ]; then
          echo $GOOGLE_DRIVE_CREDENTIALS_BASE64 | base64 -d > credentials.json
          echo "✓ Credentials file created"
        else
          echo "⚠ GOOGLE_DRIVE_CREDENTIALS_BASE64 secret not found"
          exit 1
        fi
    
    - name: Run sync script
      run: python sync_from_google_drive.py
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add IMAGE/
        git diff --staged --quiet || git commit -m "Sync latest 3 folders from Google Drive [skip ci]"
        git push
